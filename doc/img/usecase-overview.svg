<svg xmlns="http://www.w3.org/2000/svg" class="uc uc-overview" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">The car world at a glance</title>
<desc id="overview-desc">Volkswagen AG publishes a catalog per model year. A catalog lists cars. Each car, like the Volkswagen Polo, has a price, a brand and model, a workshop, its parts and a 3D model.</desc>
