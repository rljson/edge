<title id="manufacturer-title">A manufacturer and its catalogs</title>
<desc id="manufacturer-desc">Velora AG, founded 1919, has its headquarters at Hauptstraße 1001, Ingolstadt. It publishes a catalog of cars for each of the years 2026 and 2027.</desc>
